<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đụt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --frame: #e9e3d6;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --frame: #0b0a12; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --frame: #0b0a12; color-scheme: dark; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--frame);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; max-width: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  canvas:focus { outline: none; }
  canvas:focus-visible { outline: 2px solid #f6cc4c; outline-offset: 3px; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Game Đụt: phím mũi tên để đi, phím cách để nhảy"></canvas>
<script>
/* =====================================================================
   ĐỤT — bản demo
   ---------------------------------------------------------------------
   SPRITE SHEET CỦA ĐỤT: sprites/dut_sheet.png, lưới ô vuông SHEET.cell px.
   Mỗi hàng là một hoạt ảnh; bảng SHEET.anims cho biết hàng, các khung
   và tốc độ (khung/giây). Muốn thêm khung: vẽ thêm ô vào hàng và thêm
   số cột vào frames. Xem sprite_guide.png để biết ô nào là gì.
   ---------------------------------------------------------------------
   THAY HÌNH: mọi hình của Đụt, hộp giày và bóng là file PNG riêng trong
   thư mục sprites/. Vẽ hình mới, giữ nguyên tên file là game tự dùng.
   Hình được co giãn vừa khung trong SPRITE_BOX, neo ở giữa đáy.
   Đụt quay mặt sang PHẢI; khi đi sang trái game tự lật hình.
   ===================================================================== */
const SPRITES = {
  dut_sheet:     'sprites/dut_sheet.png',      // toàn bộ khung hình của Đụt (xem SHEET bên dưới)
  friends_sheet: 'sprites/friends_sheet.png',  // các bạn mèo ở màn cuối: mỗi hàng một bạn
  court_people:  'sprites/court_people.png',   // ký ức sân bóng rổ: hàng 0 nam, hàng 1 nữ (ô 40x64)
  people_sheet:  'sprites/people_sheet.png',   // người trong ký ức tủ lạnh: hàng 0 nữ, hàng 1 nam (ô 40x84)
  box_base:      'sprites/box_base.png',       // thân hộp giày
  box_lid:       'sprites/box_lid.png',        // nắp hộp giày
  ball_red:      'sprites/ball_red.png',
  ball_yellow:   'sprites/ball_yellow.png',
  ball_blue:     'sprites/ball_blue.png',
  ball_green:    'sprites/ball_green.png',
  ball_pink:     'sprites/ball_pink.png',
};
const SHEET = {
  cell: 40,
  anims: {
    walk:      { row: 0, frames: [0, 1, 2, 3] },                 // chạy theo quãng đường, không theo thời gian
    sit:       { row: 1, frames: [0, 1, 0, 3, 0, 1, 2, 0], fps: 2.2 },  // ô 2 = chớp mắt
    lie:       { row: 2, frames: [0, 0, 0, 1, 0, 0], fps: 1.4 },
    lie_blink: { row: 2, frames: [2, 3], fps: .9 },
    eat:       { row: 3, frames: [0, 1, 2, 3], fps: 5 },
    jump_up:   { row: 4, frames: [0] },
    jump_down: { row: 4, frames: [1] },
    stretch:   { row: 4, frames: [2] },
    dazed:     { row: 4, frames: [3] },
    stand:     { row: 5, frames: [0] },
    scratch:   { row: 6, frames: [0, 1, 2, 3], fps: 6 },             // cúi thấp, một chân trước cào gạt cát
  },
};
// tên tư thế dùng trong code → hoạt ảnh trong sheet
const POSE = {
  cat_walk_1: ['walk', 0], cat_walk_3: ['walk', 1], cat_walk_2: ['walk', 2], cat_walk_4: ['walk', 3],
  cat_sit: 'sit', cat_sit_blink: ['sit', 2], cat_lie: 'lie', cat_lie_blink: 'lie_blink', cat_eat: 'eat', cat_stand: 'stand', cat_scratch: 'scratch',
  cat_jump: 'jump_up', cat_pounce: 'jump_up', cat_jump_down: 'jump_down', cat_stretch: 'stretch', cat_miss: 'dazed',
};
const SPRITE_BOX = { cat: [40, 40], ball: [10, 10], box_base: [40, 22], box_lid: [44, 7] };

/* ---------------- Khung hình ---------------- */
const W = 256, H = 144;
const cv = document.getElementById('game');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const k = s >= 2 ? Math.floor(s) : s;
  cv.style.width = W * k + 'px'; cv.style.height = H * k + 'px';
}
addEventListener('resize', resize); resize();

const IMG = {};
function loadSprites() {
  return Promise.all(Object.entries(SPRITES).map(([k, src]) => new Promise(res => {
    const im = new Image();
    im.onload = () => { IMG[k] = im; res(); };
    im.onerror = () => { console.warn('Không tải được hình', src); res(); };
    im.src = src;
  })));
}
function drawImg(im, sx0, sy0, sw, sh, cx, bottom, box, opt) {
  const [bw, bh] = box;
  const sx = opt.sx ?? (opt.flip ? -1 : 1), sy = opt.sy ?? 1;
  ctx.save(); ctx.globalAlpha = opt.alpha ?? 1;
  if (!im) { ctx.fillStyle = '#8a93a8'; ctx.fillRect(Math.round(cx - bw / 2), Math.round(bottom - bh), bw, bh); ctx.restore(); return; }
  const s = Math.min(bw / sw, bh / sh);
  const dw = Math.max(1, Math.round(sw * s * Math.abs(sx))), dh = Math.max(1, Math.round(sh * s * sy));
  const x = Math.round(cx - dw / 2), y = Math.round(bottom - dh);
  if (sx < 0) { ctx.translate(x + dw, y); ctx.scale(-1, 1); ctx.drawImage(im, sx0, sy0, sw, sh, 0, 0, dw, dh); }
  else ctx.drawImage(im, sx0, sy0, sw, sh, x, y, dw, dh);
  ctx.restore();
}
// opt.sx / opt.sy: co giãn quanh điểm giữa đáy (sx âm = lật ngang)
function spr(name, cx, bottom, box, opt = {}) {
  const im = IMG[name];
  drawImg(im, 0, 0, im ? im.width : 1, im ? im.height : 1, cx, bottom, box, opt);
}
function cat(pose, cx, bottom, opt = {}) {
  const im = IMG.dut_sheet, m = POSE[pose] || 'stand', S0 = SHEET.cell;
  let a, f;
  if (Array.isArray(m)) { a = SHEET.anims[m[0]]; f = m[1]; }   // [hoạt ảnh, cột]
  else { a = SHEET.anims[m]; const n = a.frames.length; f = a.frames[a.fps ? Math.floor(nowA() * a.fps + (opt.phase || 0)) % n : 0]; }
  drawImg(im, f * S0, a.row * S0, S0, S0, cx, bottom, SPRITE_BOX.cat, opt);
}
/* bóng đổ mềm dưới chân; h = độ cao so với mặt đất */
function shadow(x, gy, h = 0, a = .22) {
  const k = clamp(1 - h / 70), w = Math.round(9 * (.55 + .45 * k));
  ctx.globalAlpha = a * k; ctx.fillStyle = '#1a1028';
  ctx.fillRect(Math.round(x - w), Math.round(gy) - 1, w * 2, 2);
  ctx.fillRect(Math.round(x - w + 2), Math.round(gy) - 2, w * 2 - 4, 1);
  ctx.globalAlpha = 1;
}
function groundBelow(lvl, x, y) {
  let g = null;
  lvl.solids.forEach(([x0, x1, top]) => { if (x > x0 && x < x1 && top >= y - 1 && (g === null || top < g)) g = top; });
  lvl.plats.forEach(([x0, x1, top]) => { if (x > x0 && x < x1 && top >= y - 1 && (g === null || top < g)) g = top; });
  return g;
}
const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const easeOut = k => 1 - (1 - k) * (1 - k);
const BALL_NAMES = ['ball_red', 'ball_yellow', 'ball_blue', 'ball_green', 'ball_pink'];
const BALL_RGB = [[238, 98, 98], [246, 204, 76], [92, 156, 236], [110, 200, 120], [240, 140, 196]];

/* ---------------- Tiện ích vẽ ---------------- */
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgb = a => 'rgb(' + a.map(Math.round).join(',') + ')';
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
function mixA(a, b, t) { t = clamp(t); return a.map((v, i) => v + (b[i] - v) * t); }
function mix(a, b, t) { return rgb(mixA(hex(a), hex(b), t)); }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function glow(x, y, r, c, a) { // quầng sáng cộng màu
  if (a <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},${a})`);
  g.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);
  ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
  ctx.globalCompositeOperation = 'source-over';
}
function pixRing(cx, cy, r, color, alpha) {
  ctx.globalAlpha = alpha; ctx.fillStyle = color;
  const n = Math.max(12, Math.round(r * 6));
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; ctx.fillRect(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r), 1, 1); }
  ctx.globalAlpha = 1;
}
function paw(x, y, c, a = 1) {
  ctx.globalAlpha = a;
  rect(x - 2, y, 5, 3, c); rect(x - 1, y + 3, 3, 1, c);
  rect(x - 3, y - 2, 1, 2, c); rect(x - 1, y - 3, 1, 2, c); rect(x + 1, y - 3, 1, 2, c); rect(x + 3, y - 2, 1, 2, c);
  ctx.globalAlpha = 1;
}
const HEART = ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'];
function heart(x, y, c, a = 1) {
  ctx.globalAlpha = a; ctx.fillStyle = c;
  HEART.forEach((row, j) => [...row].forEach((ch, i) => ch === '#' && ctx.fillRect(x + i - 3, y + j, 1, 1)));
  ctx.globalAlpha = 1;
}
function text(str, x, y, size, color, a = 1) {
  ctx.globalAlpha = a; ctx.fillStyle = color;
  ctx.font = size + 'px VT323, "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y); ctx.globalAlpha = 1;
}
let seed = 1;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* ---------------- Hạt lấp lánh ---------------- */
let parts = [];
function burst(x, y, n, colors, speed = 40, life = .8, g = 40) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = speed * (.3 + Math.random() * .7);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 10, life, max: life, c: colors[i % colors.length], g });
  }
}
function updateParts(dt) {
  parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vx *= .98; p.life -= dt; });
  parts = parts.filter(p => p.life > 0);
}
function drawParts(ox = 0) {
  parts.forEach(p => { ctx.globalAlpha = clamp(p.life / p.max * 1.5); rect(p.x - ox, p.y, 1, 1, p.c); });
  ctx.globalAlpha = 1;
}

/* ---------------- Âm thanh (tự tổng hợp) ---------------- */
let AC = null, master, noiseBuf;
function audioInit() {
  if (AC) { AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = .6;
  // tiếng vang nhẹ cho cảm giác không gian huyền ảo
  const dly = AC.createDelay(), fb = AC.createGain(), wet = AC.createGain(), lp = AC.createBiquadFilter();
  dly.delayTime.value = .32; fb.gain.value = .32; wet.gain.value = .28; lp.type = 'lowpass'; lp.frequency.value = 2200;
  master.connect(dly); dly.connect(lp); lp.connect(fb); fb.connect(dly); lp.connect(wet);
  const comp = AC.createDynamicsCompressor();
  master.connect(comp); wet.connect(comp); comp.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * .2, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function tone(m, t, dur, { type = 'triangle', vol = .15, att = .005, cut = 0, glide = 0 } = {}) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(mtof(m), t);
  if (glide) o.frequency.exponentialRampToValueAtTime(mtof(m + glide), t + dur * .6);
  let n = o;
  if (cut) { const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut; o.connect(f); n = f; }
  n.connect(g); g.connect(master);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.start(t); o.stop(t + dur + .05);
}
function pluck(m, t, v = .2) { tone(m, t, .6, { vol: v }); tone(m + 12, t, .3, { type: 'sine', vol: v * .5 }); tone(m, t, .25, { type: 'square', vol: v * .1, cut: 2200 }); }
function musicbox(m, t, v = .1) { tone(m + 12, t, 1.5, { type: 'sine', vol: v }); tone(m + 24, t, .5, { type: 'sine', vol: v * .25 }); }
function thump(t, v = .45) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(45, t + .18);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + .25);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + .3);
}
function pad(ms, t, dur, v = .035) {
  ms.forEach(m => {
    const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
    o.type = 'triangle'; o.frequency.value = mtof(m); o.detune.value = (Math.random() - .5) * 12;
    f.type = 'lowpass'; f.frequency.value = 1000;
    o.connect(f); f.connect(g); g.connect(master);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + dur * .35); g.gain.linearRampToValueAtTime(0, t + dur);
    o.start(t); o.stop(t + dur + .05);
  });
}
function meow(t, v = .08) {
  const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
  o.type = 'sawtooth'; f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 3;
  o.frequency.setValueAtTime(520, t); o.frequency.linearRampToValueAtTime(820, t + .12); o.frequency.linearRampToValueAtTime(480, t + .4);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .05); g.gain.linearRampToValueAtTime(0, t + .42);
  o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + .45);
}
function sweep(t, dir = 1) {
  const ns = [67, 69, 72, 74, 76, 79, 81, 84];
  (dir > 0 ? ns : ns.slice().reverse()).forEach((m, i) => musicbox(m - 12, t + i * .06, .06));
}
function sfxJump() { if (AC) tone(70, AC.currentTime, .14, { type: 'sine', vol: .06, glide: 7 }); }
function sfxLand() { if (AC) thump(AC.currentTime, .08); }

let queue = [];
const at = (t, fn) => queue.push({ t, fn });
function runQueue() {
  if (!AC) return;
  const lim = AC.currentTime + .15;
  queue = queue.filter(e => { if (e.t < lim) { e.fn(e.t); return false; } return true; });
}

const SCALE = [72, 74, 76, 79, 81, 84, 86, 88];
/* BÀI HÁT CỦA ĐỤT (giai điệu sáng tác riêng cho game, số MIDI: 60 = Đô giữa).
   Mỗi quả bóng nhặt được phát nốt tiếp theo. 4 câu nhạc:
   1) mở đầu sáng  2) chùng xuống nhờ nốt La giáng (Fm)  3) Sol thăng (E7) gợi nhớ  4) ấm lại, về Đô */
const SONG = [76, 79, 84, 83, 81, 76,      // E G C B A E
              77, 81, 84, 80, 79,          // F A C Ab G
              76, 79, 80, 83,              // E G G# B
              81, 84, 86, 83, 79, 77, 76, 74, 72];  // A C D B G F E D C
const SONG_BEATS = [0, 1, 2, 3, 4, 6, 8, 9, 10, 11, 12, 16, 17, 18, 19, 24, 25, 26, 27, 28, 29, 30, 31, 32];
// Vòng hợp âm 8 ô nhịp: C – Am – F – Fm – C/G – E7 – Am – G7
const PROG = [[60, 64, 67], [57, 60, 64], [57, 60, 65], [56, 60, 65], [55, 60, 64], [56, 59, 64], [57, 60, 64], [55, 59, 65]];
const ROOTS = [48, 45, 41, 41, 43, 40, 45, 43];
const BEAT = .8;

/* ---------------- Bảng màu ---------------- */
const VOID = '#07060c';
const NIGHT = {
  top: '#1b1640', mid: '#4a3a7c', low: '#e391b0',
  far: '#6a5596', mid2: '#40357a', near: '#2a2458',
  grass: '#78d8a8', grassHi: '#d8ffea', grassDk: '#3f9c86', dirt: '#2f2656', dirtDk: '#221b44', crystal: '#9fe8ff',
  fog: [242, 170, 200], star: '#fff6e0',
};
const GOLD = {
  top: '#4b3a86', mid: '#e0849e', low: '#ffd59a',
  far: '#c27aa6', mid2: '#9a5d8e', near: '#6e4a7e',
  grass: '#bcd47a', grassHi: '#fff4b8', grassDk: '#8aa25a', dirt: '#6a4a72', dirtDk: '#57395f', crystal: '#ffe2a8',
  fog: [255, 210, 170], star: '#fff6e0',
};

/* ---------------- Thế giới ---------------- */
const LW = 1320;                  // chiều dài màn
const SOLIDS = [[0, 262, 120], [300, 470, 112], [520, 640, 120], [640, 760, 104], [810, 962, 120], [1080, LW, 120]];
const PLATS = [[378, 422, 84], [596, 640, 88], [686, 730, 72], [984, 1016, 108], [1038, 1068, 98]];
const BALL_POS = [[200, 106], [222, 102], [244, 106], [276, 94], [290, 92], [340, 98], [400, 72], [440, 98],
  [492, 94], [506, 98], [560, 106], [618, 76], [668, 90], [708, 60], [784, 90], [798, 96],
  [860, 106], [888, 104], [916, 106], [1000, 96], [1053, 86], [1112, 106], [1140, 102], [1168, 106]];
const LANTERNS = [[180, 120], [560, 120], [850, 120]];
const BOX_X = 128, PORTAL_X = 1250;
const STARS = Array.from({ length: 90 }, () => ({ x: rnd() * W, y: rnd() * 80, p: rnd() * 6, b: rnd() < .15 }));
const ISLANDS = [[60, 46, 26], [230, 34, 18], [380, 52, 30], [560, 40, 20], [720, 48, 26], [880, 36, 16], [1010, 50, 24]];
const MOTES = Array.from({ length: 40 }, () => ({ x: rnd() * W, y: rnd() * H, p: rnd() * 6, s: 3 + rnd() * 6, c: rnd() < .5 ? [200, 255, 220] : [255, 220, 240] }));
// trang trí mọc trên mặt đất (cố định)
const DECOR = [];
seed = 42;
SOLIDS.forEach(([x0, x1, top]) => {
  for (let x = x0 + 6; x < x1 - 6; x += 5 + Math.floor(rnd() * 8)) {
    const r = rnd();
    DECOR.push({ x, y: top, k: r < .35 ? 'grass' : r < .55 ? 'flower' : r < .68 ? 'mush' : r < .8 ? 'catnip' : r < .88 ? 'crystal' : 'grass', p: rnd() * 6, c: Math.floor(rnd() * 5) });
  }
});
const SPECKS = Array.from({ length: 260 }, () => ({ x: rnd() * LW, y: rnd() * 40, c: rnd() }));

function hillLayer(base, amp, f1, f2, off, color, extra) {
  ctx.fillStyle = color;
  for (let x = 0; x < W; x++) {
    const wx = x + off;
    const y = Math.round(base + Math.sin(wx * f1) * amp + Math.sin(wx * f2 + 1.7) * amp * .5);
    ctx.fillRect(x, y, 1, H - y);
    if (extra) extra(x, wx, y);
  }
}
function treeSil(x, y, r, color) { // tán cây tròn
  ctx.fillStyle = color;
  for (let j = -r; j <= r; j++) { const w = Math.round(Math.sqrt(r * r - j * j)); ctx.fillRect(Math.round(x - w), Math.round(y + j - r), w * 2, 1); }
  ctx.fillRect(Math.round(x), Math.round(y), 1, r + 2);
}

/* Vẽ toàn bộ phông nền. L: độ sáng 0..1, P: bảng màu, cam: vị trí camera */
function drawBackdrop(P, L, cam, t, opt = {}) {
  const top = hex(P.top), mid = hex(P.mid), low = hex(P.low), v = hex(VOID);

    S.ballImg = BALL_NAMES[Math.floor(Math.random() * 5)];

    [2.55, 4.7].forEach(d => at(t + d, tt => thump(tt, .1)));
    at(t + 6.2, tt => meow(tt, .05));

    for (let i = 0; i < 26; i++) at(t + .3 + 4.6 * Math.pow(i / 26, .7), tt => tick(tt));

  S = { t0, hearts: [] };
  // nhạc nền êm + tiếng dế
  PROG.forEach((c, i) => at(t0 + .3 + i * 1.8, tt => pad(c.map(m => m - 12), tt, 2.2, .026)));
  SONG.slice(0, 15).forEach((m, i) => at(t0 + .8 + SONG_BEATS[i] * .5, tt => musicbox(m - 12, tt, .06)));
  for (let i = 0; i < 28; i++) at(t0 + .5 + i * .52 + (i % 3) * .07, tt => { tone(100, tt, .05, { type: 'sine', vol: .012 }); tone(100, tt + .07, .05, { type: 'sine', vol: .012 }); });
  at(t0 + 1.7, tt => purr(tt, 3, .06));
  at(t0 + 3.6, tt => meow(tt, .05));
  at(t0 + 8.6, tt => sweep(tt));
  at(t0 + 11, tt => meow(tt, .05));
}
function updateCourt(dt) {
  const k = nowA() - S.t0;
  [[2.2, SEATS.dut - 4], [6, SEATS.dut + 6], [11.2, SEATS.dut], [11.8, SEATS.m], [12.2, SEATS.f]].forEach(([at_, x], i) => {
    if (k > at_ && !S.hearts.some(h => h.i === i)) S.hearts.push({ i, x, y: SEAT - 30, t: k });
  });
  if (k > 14.2 && !nextScene) go('valley', '#fff6e4');
}
function courtPersonCol(sex, k) {
  if (k > 8.8 && k < 10.6) return 3;                         // cùng ngước nhìn sao băng
  if (sex === 'm' && k > 1.4 && k < 3.2) return 2;           // anh vuốt đầu Đụt
  if (sex === 'f' && k > 5.4 && k < 7.2) return 2;           // chị vuốt lưng Đụt
  if ((k > 3.6 && k < 5.2) || k > 10.8) return (Math.floor(k * 3) + (sex === 'f' ? 1 : 0)) % 4 < 3 ? 1 : 0;  // cười vui
  return 0;
}
function drawCourt() {
  const k = nowA() - S.t0, t = nowA();
  // trời đêm
  for (let y = 0; y < 90; y += 2) rect(0, y, W, 2, mix('#0b0d22', '#28284a', y / 90));
  CSTARS.forEach(s => {
    const a = .4 + .6 * (.5 + .5 * Math.sin(t * 2 + s.p));
    ctx.globalAlpha = a; rect(s.x, s.y, 1, 1, '#fff6dc');
    if (s.big) { ctx.globalAlpha = a * .6; rect(s.x - 2, s.y, 5, 1, '#fff6dc'); rect(s.x, s.y - 2, 1, 5, '#fff6dc'); }
  });
  ctx.globalAlpha = 1;
  [[46, 12], [86, 6], [170, 8], [238, 12], [196, 26], [128, 18]].forEach(([x, y], i) => {   // sao bốn cánh như trong ảnh
    const s = 2 + Math.round(1 + Math.sin(t * 1.6 + i));
    ctx.globalAlpha = .9; rect(x - s, y, s * 2 + 1, 1, '#ffffff'); rect(x, y - s, 1, s * 2 + 1, '#ffffff');
    rect(x - 1, y - 1, 3, 3, '#fff6dc'); glow(x, y, 8, [255, 240, 200], .25); ctx.globalAlpha = 1;
  });
  // sao băng
  if (k > 8.6 && k < 9.8) {
    const u = (k - 8.6) / 1.2, sx = 230 - u * 170, sy = 8 + u * 30;
    for (let i = 0; i < 12; i++) { ctx.globalAlpha = (1 - i / 12) * (1 - u * .5); rect(sx + i * 2, sy - i * .35 * 2, 2, 1, '#fff6dc'); }
    ctx.globalAlpha = 1; glow(sx, sy, 8, [255, 250, 220], .6);
  }
  // hàng cây xa
  hillLayer(80, 3, .07, .15, 0, '#141a2c');
  for (let x = 6; x < W; x += 22) treeSil(x, 80 + Math.sin(x) * 2, 7 + (x % 3), '#141a2c');
  // cỏ
  rect(0, 84, W, H - 84, '#1f3a2c');
  for (let y = 88; y < H; y += 4) for (let x = (y * 5) % 7; x < W; x += 7) rect(x, y, 1, 2, '#2c5039');
  // đèn sân
  rect(14, 30, 2, 64, '#2a2e3a'); rect(10, 28, 10, 3, '#3a3f4e'); rect(11, 31, 8, 1, '#fff2c8');
  glow(15, 32, 70, [255, 230, 170], .22);
  // sân bóng rổ (hình bình hành phối cảnh)
  ctx.fillStyle = '#3c5a86';
  ctx.beginPath(); ctx.moveTo(44, 88); ctx.lineTo(236, 88); ctx.lineTo(252, 112); ctx.lineTo(18, 112); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,240,200,.08)'; ctx.fillRect(18, 88, 240, 24);
  const line = (x0, y0, x1, y1) => { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)); for (let i = 0; i <= n; i++) rect(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, 1, 1, '#e8eef8'); };
  line(44, 88, 236, 88); line(236, 88, 252, 112); line(252, 112, 18, 112); line(18, 112, 44, 88);
  line(135, 88, 135, 112);
  for (let i = 0; i < 40; i++) { const a = i / 40 * Math.PI * 2; rect(135 + Math.cos(a) * 12, 100 + Math.sin(a) * 4, 1, 1, '#e8eef8'); }
  line(206, 94, 226, 94); line(226, 94, 232, 106); line(232, 106, 212, 106); line(212, 106, 206, 94);
  // trụ bóng rổ
  rect(218, 34, 2, 72, '#cfd4de'); rect(218, 34, 1, 72, '#ffffff');
  rect(200, 14, 30, 20, '#e8eef8'); rect(201, 15, 28, 18, '#2a3550'); rect(209, 22, 12, 8, '#e8eef8'); rect(210, 23, 10, 6, '#2a3550');
  rect(208, 34, 14, 2, '#f08a3a'); rect(207, 35, 16, 1, '#c86a28');
  for (let i = 0; i < 5; i++) { const sw = Math.sin(t * 2 + i) * .5; rect(209 + i * 3 + sw, 36, 1, 6 - Math.abs(i - 2), '#ffffff'); }
  rect(212, 41, 6, 1, '#ffffff');
  // đom đóm trên cỏ
  for (let i = 0; i < 14; i++) {
    const x = (i * 53 + Math.sin(t * .5 + i) * 10) % W, y = 116 + (i * 17) % 24 + Math.sin(t + i * 2) * 3;
    rect(x, y, 1, 1, '#e8ff9a'); glow(x, y, 4, [220, 255, 150], .3 * (.5 + .5 * Math.sin(t * 3 + i)));
  }
  // khối ghế đá
  rect(42, SEAT - 5, 144, 5, '#b4b8c2'); rect(42, SEAT - 5, 144, 1, '#d4d8e0');
  rect(46, SEAT, 136, COURT_GROUND - SEAT, '#8a8f9a'); rect(182, SEAT - 4, 6, COURT_GROUND - SEAT + 4, '#6c707a');
  rect(46, SEAT, 136, 1, '#6c707a'); for (let x = 54; x < 180; x += 17) rect(x, SEAT + 4 + (x % 3), 2, 1, '#7a7f8a');
  shadow(114, COURT_GROUND + 2, 0, .3);
  // ba người bạn
  const pc = sex => courtPersonCol(sex, k);
  const bob = sex => (pc(sex) === 1 ? -Math.abs(Math.round(Math.sin(t * 9))) : 0);
  drawImg(IMG.court_people, pc('m') * 40, 0, 40, 64, SEATS.m, COURT_GROUND + bob('m'), [40, 64], {});
  drawImg(IMG.court_people, pc('f') * 40, 64, 40, 64, SEATS.f, COURT_GROUND + bob('f'), [40, 64], {});
  let dp = 'cat_sit';
  if ((k > 1.6 && k < 3.2) || (k > 5.6 && k < 7.2)) dp = 'cat_sit_blink';
  cat(dp, SEATS.dut, SEAT - 4, { sy: 1 + Math.sin(t * 2.2) * .02 });
  // tim
  S.hearts.forEach(h => { const u = (k - h.t) / 2.4; if (u < 0 || u > 1) return; heart(Math.round(h.x + Math.sin(u * 6) * 2), Math.round(h.y - u * 20), '#f07a90', clamp(Math.min(u * 6, (1 - u) * 2))); });
  // lớp màu ký ức
  ctx.globalAlpha = .12; rect(0, 0, W, H, '#ffcf9a'); ctx.globalAlpha = 1;
  for (let i = 0; i < 30; i++) { ctx.globalAlpha = .1; rect(Math.random() * W, Math.random() * H, 1, 1, '#ffffff'); }
  ctx.globalAlpha = 1;
  rect(0, 0, W, 6, '#0a0910'); rect(0, H - 6, W, 6, '#0a0910');
  const v = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, 165);
  v.addColorStop(0, 'rgba(10,8,20,0)'); v.addColorStop(1, 'rgba(10,8,20,.45)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

/* ---------------- Màn kết: Thung lũng nắng — Đụt gặp các bạn mèo ---------------- */
const GV = 118;
const DUT_X = 128, DUT_Y = 127;
// Các bạn mèo (hàng trong friends_sheet.png): đến từ đâu, dừng ở đâu, dáng nghỉ, lúc xuất hiện
const FRIENDS = [
  { row: 0, from: 300, to: 192, y: 125, rest: 'sit', at: 5.2, s: 1,   pitch: .85 },  // Cam
  { row: 1, from: -40, to: 90,  y: 125, rest: 'sit', at: 6.8, s: 1,   pitch: 1.1 },  // Bông
  { row: 2, from: 300, to: 228, y: 119, rest: 'lie', at: 8.2, s: 1,   pitch: .75 },  // Mun
  { row: 3, from: -50, to: 52,  y: 120, rest: 'sit', at: 9.4, s: 1,   pitch: 1 },    // Tam thể
  { row: 4, from: 300, to: 162, y: 132, rest: 'lie', at: 10.6, s: .8, pitch: 1.45 }, // Kem (mèo con)
];
const FCOL = { walk: 0, sit: 4, blink: 5, lie: 6, sleep: 7 };
function friendSpr(row, pose, frame, cx, bottom, opt) {
  const S0 = SHEET.cell, col = pose === 'walk' ? frame & 3 : FCOL[pose];
  drawImg(IMG.friends_sheet, col * S0, row * S0, S0, S0, cx, bottom, [S0 * (opt.s || 1), S0 * (opt.s || 1)], opt);
}
function meowP(t, v, p) { // tiếng meo với cao độ khác nhau cho từng bạn
  const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
  o.type = 'sawtooth'; f.type = 'bandpass'; f.frequency.value = 1400 * p; f.Q.value = 3;
  o.frequency.setValueAtTime(520 * p, t); o.frequency.linearRampToValueAtTime(820 * p, t + .12); o.frequency.linearRampToValueAtTime(480 * p, t + .4);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .05); g.gain.linearRampToValueAtTime(0, t + .42);
  o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + .45);
}
function enterValley() {
  const t0 = nowA(), bt = .75;
  // lúc đầu chỉ vài nốt lẻ loi; bạn đến thì hoà âm đầy dần
  [0, 2, 4, 6].forEach((b, i) => at(t0 + 1 + b * bt, tt => musicbox(SONG[i] - 12, tt, .07)));
  at(t0 + 4.2, tt => meowP(tt, .05, 1));
  const chords = PROG.concat([[60, 64, 67]]);
  chords.forEach((c, i) => at(t0 + 5.2 + i * 4 * bt * .9, tt => pad(c.map(m => m - 12), tt, 4 * bt, .02 + Math.min(i, 4) * .004)));
  SONG.forEach((m, i) => at(t0 + 5.2 + SONG_BEATS[i] * bt * .9, tt => musicbox(m - 12, tt, .09)));
  FRIENDS.forEach(f => {
    const dur = Math.abs(f.to - f.from) / 46;
    at(t0 + f.at + dur - .1, tt => { meowP(tt, .045, f.pitch); musicbox(SCALE[(f.row + 3) % 8], tt + .25, .07); });
  });
  at(t0 + 12.4, tt => purr(tt, 4.5, .07));
  at(t0 + 15.4, tt => sweep(tt));
  if (SPECIAL) for (let i = 0; i < 9; i++) at(t0 + 18 + i * .6, tt => pluck(SCALE[(i * 3) % 8] + 12, tt, .07));
  S = { t0, fw: 0, hearts: [], popped: {}, fs: 1 };
}
function updateValley(dt) {
  const k = nowA() - S.t0;
  // Đụt nhìn quanh khi còn một mình
  const face = k > 3.8 && k < 4.6 ? -1 : 1;
  S.fs += (face - S.fs) * Math.min(1, dt * 9);
  FRIENDS.forEach((f, i) => {
    const dur = Math.abs(f.to - f.from) / 46;
    if (k > f.at + dur && !S.popped[i]) { S.popped[i] = 1; S.hearts.push({ x: (f.to + DUT_X) / 2, y: 100, t: k }); }
  });
  if (k > 12.4 && k < 13.4 && !S.blinkH) { S.blinkH = 1; [70, 100, 128, 156, 190].forEach((x, j) => S.hearts.push({ x, y: 102 - j % 2 * 6, t: k + j * .15 })); }
  S.hearts = S.hearts.filter(h => k - h.t < 2.4);
  if (SPECIAL && k > 18 && k < 23.5) {
    S.fw -= dt;
    if (S.fw <= 0) { S.fw = .6; burst(40 + Math.random() * 176, 16 + Math.random() * 30, 30, BALL_RGB.map(rgb), 48, 1.3); }
  }
}
function drawValley() {
  const k = nowA() - S.t0, t = nowA();
  drawBackdrop(GOLD, 1, 0, t, { planet: false, sun: true, starA: .35, aurora: .5 });
  // Trái Đất
  const ea = clamp((k - 14.2) / 1.6);
  if (ea > 0) {
    glow(206, 30, 22, [140, 200, 255], .35 * ea);
    ctx.globalAlpha = ea;
    for (let y = -8; y <= 8; y++) for (let x = -8; x <= 8; x++) {
      const d = x * x + y * y; if (d > 64) continue;
      rect(206 + x, 30 + y, 1, 1, d > 49 ? '#3d6fb0' : ((x * 3 + y * 5 + 40) % 7 < 3 ? '#6ec878' : '#5c9cec'));
    }
    rect(203, 26, 2, 1, '#ffffff'); ctx.globalAlpha = 1;
  }
  // đồng cỏ
  rect(0, GV, W, H - GV, '#a7bd6c'); rect(0, GV, W, 1, '#fff4b8'); rect(0, GV + 1, W, 2, '#bcd47a');
  for (let y = GV + 6; y < H; y += 5) for (let x = (y * 7) % 9; x < W; x += 9) rect(x, y, 1, 2, '#93ab5c');
  for (let x = 2; x < W; x += 4) { const h = 2 + (x * 7 % 3); rect(x, GV - h, 1, h, '#8aa25a'); }
  for (let i = 0; i < 18; i++) { const x = (i * 37) % W, c = BALL_RGB[i % 5], y = GV + (i * 13 % 20); rect(x, y - 5, 1, 5, '#7a9a4a'); rect(x - 1, y - 6, 3, 1, rgb(c)); rect(x, y - 7, 1, 3, rgb(c)); }
  // các chú mèo, vẽ từ sau ra trước
  const list = FRIENDS.map((f, i) => ({ f, i, y: f.y })).concat([{ dut: 1, y: DUT_Y }]).sort((a, b) => a.y - b.y);
  const slowBlink = k > 12.4 && k < 13.4;
  list.forEach(o => {
    if (o.dut) {
      let x = DUT_X, pose = 'cat_sit', sy = 1, fsx = 1;
      if (k < 3) { const d = 148 * easeOut(k / 3); x = -20 + d; pose = k > 2.7 ? 'cat_stand' : WALK4[Math.floor(d / 5) & 3]; }
      else if (k < 3.5) pose = 'cat_stand';
      else if (k > 14) pose = k > 17.2 ? 'cat_lie_blink' : 'cat_lie';
      if (slowBlink) pose = k > 14 ? 'cat_lie_blink' : 'cat_sit_blink';
      if (/sit|lie|stand/.test(pose)) sy = 1 + Math.sin(t * 2.2) * .02;
      fsx = k >= 3 ? Math.sign(S.fs || 1) * Math.max(.18, Math.abs(S.fs)) : 1;
      glow(x, DUT_Y - 10, 22, [255, 230, 200], .2);
      shadow(x, DUT_Y, 0, .2);
      cat(pose, x, DUT_Y, { sx: fsx, sy });
      return;
    }
    const f = o.f, u0 = k - f.at; if (u0 < 0) return;
    const dur = Math.abs(f.to - f.from) / 46, u = clamp(u0 / dur);
    const x = lerp(f.from, f.to, easeOut(u)), moving = u < 1;
    let pose = moving ? 'walk' : f.rest, frame = Math.floor(Math.abs(x - f.from) / 5);
    const dirMove = Math.sign(f.to - f.from), dirRest = Math.sign(DUT_X - f.to) || 1;
    if (!moving) {
      const ph = (t * .37 + f.row * .23) % 1;
      if (f.rest === 'sit' && ph < .07) pose = 'blink';
      if (slowBlink) pose = f.rest === 'sit' ? 'blink' : 'sleep';
      if (f.row === 4 && k > 15) pose = 'sleep';
      if (f.row === 2 && k > 16) pose = 'sleep';
    }
    const sy = !moving ? 1 + Math.sin(t * 2.2 + f.row) * .02 : 1;
    shadow(x, f.y, 0, .18);
    friendSpr(f.row, pose, frame, x, f.y, { s: f.s, sx: moving ? dirMove : dirRest, sy });
  });
  // tim nhỏ bay lên
  S.hearts.forEach(h => { const u = (k - h.t) / 2.4; if (u < 0) return; heart(Math.round(h.x + Math.sin(u * 6) * 2), Math.round(h.y - u * 22), '#f07a90', clamp(Math.min(u * 6, (1 - u) * 2))); });
  // lúc đầu hơi lạnh và cô đơn, ấm dần khi các bạn tới
  const arrived = FRIENDS.filter((f, i) => S.popped[i]).length;
  S.cold = (S.cold ?? 1) + (((5 - arrived) / 5) - (S.cold ?? 1)) * .02;
  if (S.cold > .01) { ctx.globalAlpha = .28 * S.cold; rect(0, 0, W, H, '#4a5a90'); ctx.globalAlpha = 1; }
  // sao băng Đụt gửi về Trái Đất
  if (k > 15.4 && k < 17) {
    const u = (k - 15.4) / 1.6;
    const sx = DUT_X + 6 + (206 - DUT_X - 6) * u, sy = 108 + (30 - 108) * u - Math.sin(u * Math.PI) * 12;
    glow(sx, sy, 10, [255, 250, 220], .6);
    for (let i = 0; i < 7; i++) rect(sx - i * 2 * (1 - u * .3), sy + i * 1.8, 1, 1, i ? '#fff3c4' : '#ffffff');
    if (Math.random() < .5) burst(sx, sy, 1, ['#fff3c4'], 6, .5);
  }
  if (k > 17 && !S.sparked) { S.sparked = 1; burst(206, 30, 24, ['#ffffff', '#fff3c4', '#6ec878'], 30, 1); }
  drawMotes(1, 0, t, [255, 240, 200]);
  drawParts();
  const ta = clamp((k - 18) / 1.5);
  if (ta > 0) { heart(128, 10, '#e86a7a', ta); text('Đụt', 128, 25, 20, '#5a2f4a', ta); text('4/5/2026', 128, 37, 12, '#7a4a5a', ta); }
  if (k > 20) paw(128, 140, '#5a2f4a', .3 + .3 * Math.sin(nowP() * 3));
}

/* ---------------- Vòng lặp ---------------- */
let last = nowP();
function frame() {
  const t = nowP(), dt = Math.min(.05, t - last); last = t;
  runQueue();
  fade += (fadeTarget - fade) * Math.min(1, dt * 4);
  if (nextScene && fade > .97) { enter(nextScene); nextScene = null; fadeTarget = 0; }
  if (scene === 'world') updateWorld(dt);
  if (scene === 'room') updateRoom(dt);
  if (scene === 'court') updateCourt(dt);
  if (scene === 'valley') updateValley(dt);
  updateParts(dt);
  if (scene === 'title') drawTitle(t);
  else if (scene === 'world') drawWorld();
  else if (scene === 'room') drawRoom();
  else if (scene === 'court') drawCourt();
  else if (scene === 'valley') drawValley();
  if (fade > .01) { ctx.globalAlpha = fade; rect(0, 0, W, H, fadeColor); ctx.globalAlpha = 1; }
  requestAnimationFrame(frame);
}
rect(0, 0, W, H, VOID);
Promise.all([loadSprites(), document.fonts ? document.fonts.load('16px VT323').catch(() => {}) : 0])
  .then(() => { enter('title'); frame(); });
</script>
